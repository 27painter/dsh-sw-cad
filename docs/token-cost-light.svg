<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 298" width="900" height="298" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="t">Idle context cost of the two CAD MCP tool catalogues</title>
<desc id="d">AutoCAD alone 83,717 tokens, SolidWorks alone 23,404, both together 107,121; with this kit both servers advertise two meta-tools each and cost 612 tokens.</desc>
