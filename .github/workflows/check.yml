name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved, and a
      # moved tag silently changes what runs in CI. Comments carry the version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      # Syntax of everything that ships. CAD automation itself cannot run here:
      # it needs AutoCAD or SolidWorks, a Windows session, and a COM server.
      - name: Parse the JavaScript
        run: |
          node --check lib/index.js
          node --check lib/paths.mjs
          node --check bin/dsh-sw-cad.mjs

      - name: Compile the Python
        run: |
          python -m py_compile lib/probe.py

      - name: Resolve paths without a CAD install
        run: node bin/dsh-sw-cad.mjs where

      - name: Report the pinned upstream
        run: node bin/dsh-sw-cad.mjs version

      - name: Pack
        run: npm pack --dry-run

      - name: Install the dev dependencies
        run: npm install --no-audit --no-fund

      # Without the install above this test would print SKIP and exit 0 —
      # a green run that verified nothing.
      - name: Plugin registration logic
        run: node test/plugin.test.mjs
