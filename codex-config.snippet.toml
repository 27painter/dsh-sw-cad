# ============================================================
# dsh-sw-cad -- manual Codex config.toml snippet
#
# Do not use this with the Codex plugin. The plugin ships its own
# .mcp.json and skills, and this file would register the same two
# servers a second time.
#
# This snippet is for an existing npm-global install of dsh-sw-cad.
# Append it to ~/.codex/config.toml, then verify with: codex mcp list
# ============================================================

[mcp_servers.autocad]
command = "dsh-sw-cad"
args = ["serve", "autocad"]
startup_timeout_sec = 300
tool_timeout_sec = 180

[mcp_servers.solidworks]
command = "dsh-sw-cad"
args = ["serve", "solidworks"]
startup_timeout_sec = 300
tool_timeout_sec = 300
