# dsh-sw-cad bundle patch.
#
# Inserts one row: this package itself. It is a real cordis plugin (lib/index.js),
# not a wrapper around a binary, so dsh imports it by name from the profile and
# nothing has to be on PATH.
#
# On load the plugin resolves its own paths, makes sure the pinned upstream
# servers are installed (installing them once if they are not), and registers two
# @deepseek-ai/dsh-mcp-client rows with absolute paths:
#
#   autocad     -> autocad-mcp-pro 1.6.0, DISCOVERY_MODE=search
#   solidworks  -> the discovery shim in front of upstream's 66-tool server
#
# Versions are pinned in lib/upstream.json. If the upstream cannot be installed
# the plugin throws instead of registering rows that would fail silently.

- insert:
    - id: dsh-sw-cad
      name: 'dsh-sw-cad'
