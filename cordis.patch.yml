# dsh-sw-cad -- copy into ~/.dsh/cordis.patch.yml, or let install.ps1 write it for you.
# Two MCP servers: autocad (upstream discovery mode) and solidworks (our discovery shim).
# Paths assume the default install root D:\cad-agents; change them if you used -BaseDir.
- insert:
    - id: mcp-autocad
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: autocad
        transport: stdio
        command: 'D:\cad-agents\venv-autocad\Scripts\autocad-mcp.exe'
        args: []
        env:
          # auto: COM when AutoCAD is running, ezdxf headless otherwise
          AUTOCAD_MCP_BACKEND: auto
          # keep full/all: in discovery mode the catalog costs nothing at idle,
          # narrowing it only hides tools (lean+core,mech drops gear_draw_*)
          TOOL_PROFILE: full
          TOOL_PACKS: 'all'
          # 2 meta-tools advertised (~256 tokens); 242 tools searched on demand
          DISCOVERY_MODE: search
          # scope file access; the upstream default is unscoped
          ALLOWED_PATHS: 'D:\AutoCad'
        # COM save/export/render can be slow
        toolCallTimeoutMs: 180000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
- insert:
    - id: mcp-solidworks
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: solidworks
        transport: stdio
        # the shim spawns the upstream server lazily, on the first call_tool
        command: 'D:\cad-agents\venv-solidworks\Scripts\python.exe'
        args:
          - 'D:\cad-agents\mcp-shim\sw_discovery_shim.py'
          - '--python'
          - 'D:\cad-agents\venv-solidworks\Scripts\python.exe'
          - '--server'
          - 'D:\cad-agents\dsh-skills\solidworks-automation\mcp-server\server.py'
        env:
          # 2 meta-tools at idle (~256 tokens) instead of 66 tools (~23.4k)
          SW_SHIM_TOP_K: '8'
        # model rebuilds are slow; give them time
        toolCallTimeoutMs: 300000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
