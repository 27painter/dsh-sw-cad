# dsh-sw-cad bundle patch.
#
# Inserts two `@deepseek-ai/dsh-mcp-client` rows. Both spawn the `dsh-sw-cad`
# binary that this package installs, which resolves every path it needs at
# runtime (its own location plus ~/.dsh/sw-cad.json). That is why there is no
# absolute path in this file: the same bundle works on any machine.
#
#   dsh-sw-cad serve autocad     -> upstream autocad-mcp-pro, DISCOVERY_MODE=search
#   dsh-sw-cad serve solidworks  -> the discovery shim in front of the upstream
#                                   SolidWorks server
#
# The binary must be resolvable on PATH. A global install (npm i -g dsh-sw-cad)
# puts it there; with a profile-local install, run `dsh-sw-cad where` to print
# the paths and override `command` in your own profile patch if needed.
#
# A later patch replaces a row's WHOLE `config` (it does not merge), so an
# override must restate every key it relies on. The row ids are the stable
# anchors for such overrides.

- insert:
    - id: mcp-autocad
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: autocad
        transport: stdio
        command: dsh-sw-cad
        args: ['serve', 'autocad']
        # COM save/export/render can be slow
        toolCallTimeoutMs: 180000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    - id: mcp-solidworks
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: solidworks
        transport: stdio
        command: dsh-sw-cad
        args: ['serve', 'solidworks']
        env:
          SW_SHIM_TOP_K: '8'
        # model rebuilds are slow; give them time
        toolCallTimeoutMs: 300000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
